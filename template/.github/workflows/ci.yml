name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes anything back to the repo, and the default token grant is
# broader than that. persist-credentials: false for the same reason — this job does not push, and
# the default leaves the job's token on disk for every later step to read (through checkout v5 that
# meant .git/config; v6 moved it to a separate file, and the input is unaffected either way). Both
# are what zizmor's excessive-permissions and artipacked audits ask for, and both run in
# `inv quality.check`.
permissions:
  contents: read

jobs:
  quality:
    # Floats on purpose. The move from Ubuntu 24.04 to 26.04 (from 2026-10-19) was measured green
    # on 2026-09-28, this template's own renders included, and the decision lives in repo-tasks'
    # contributing/quality-gate.md, "Workflow hardening". Do not pin ubuntu-26.04 to test ahead:
    # actionlint does not know that label yet and the gate fails on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./bootstrap-repo-tasks.sh
      - run: inv dev-env.setup
      - run: inv quality.check
      # No-ops cleanly ("nothing to do") in a repo with no tests/integration directory, which is
      # every freshly generated one — so this file stays byte-identical to the template's copy.
      - run: inv test.integration
