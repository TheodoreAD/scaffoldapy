_subdirectory: template
_preserve_symlinks: true

package_name:
  type: str
  help: "Python package name (snake_case), e.g. freshful_polite_mcp"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be snake_case: lowercase letters, digits, underscores, starting with a letter.
    {% endif %}

description:
  type: str
  help: "One-line description of the project"

interface:
  type: str
  help: "What does this repo ship?"
  choices:
    "MCP server (FastMCP, stdio) — e.g. olx-polite-mcp, temu-polite-mcp": mcp_server
    "Command-line tool (Typer)": cli
    "HTTP web service (FastAPI)": web_service
    "Agent Skill only, no server process — e.g. product-research-pipeline": skill
    "Plain importable package, no entrypoint": library

# One answer, and repo-tasks derives the rest from the requires-python it becomes: pyright's
# pythonVersion (configs.pull), and the venv check. .python-version is rendered from the same
# answer, so the dev venv, the first uv sync and CI all run at the floor. setup-uv exports no
# UV_PYTHON without a python-version input, which leaves uv reading this file, so ci.yml needs no
# matrix and stays byte-identical to the root copy. The default is 3.11 for every interface a
# consumer installs: a wrong 3.11 still runs on 3.14, while a wrong 3.14 breaks every consumer on
# install. See plans/2026-09-18-python-version-tier-rules.md.
python_floor:
  type: str
  help: "Who picks the interpreter this code runs on?"
  default: "{{ '3.14' if interface == 'web_service' else '3.11' }}"
  choices:
    "Consumers do — a library, an installed tool or MCP server, anything someone else installs (>=3.11)": "3.11"
    "You do — a service you deploy, or tooling only you run (>=3.14)": "3.14"

fetch_strategy:
  type: str
  when: "{{ interface not in ['skill', 'library'] }}"
  default: none
  help: "Does this project fetch data from an external source?"
  choices:
    "No owned fetch layer": none
    "Plain polite HTTP fetch": http
    "CDP-driven, logged-in Chrome session": browser_session

multi_source:
  type: bool
  when: "{{ fetch_strategy is defined and fetch_strategy != 'none' }}"
  default: false
  help: "Pull from more than one upstream, via a pluggable per-source adapter?"

source_key:
  type: str
  when: "{{ fetch_strategy is defined and fetch_strategy != 'none' }}"
  help: >-
    Source identifier (snake_case), e.g. olx. Names the first source module either way — a flat
    single-source layout, or the first entry under sources/ when multi_source is set (later sources
    are added by hand, or via a future `copier update` pass — the Q&A flow only seeds the first).
  validator: >-
    {% if not (source_key | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be snake_case: lowercase letters, digits, underscores, starting with a letter.
    {% endif %}

github_repo:
  type: str
  help: "e.g. TheodoreAD/freshful-polite-mcp — used in README install instructions"

with_docs:
  type: bool
  default: false
  help: >-
    Publish a docs site (mkdocs.yml + docs/, built with zensical, deployed to GitHub Pages via
    .github/workflows/docs.yml on every push to main)? Recommended for medium/larger projects — a
    good README is usually enough for a small one. WARNING: GitHub Pages sites are public even for
    a private GitHub repo (true as of the last check) — don't enable this if the docs would ever
    contain anything sensitive.

# repo-tasks/invoke are deliberately never in this template's own dependency-groups.dev (see
# pyproject.toml.jinja) — they're a user-wide `uv tool install`, not a per-project dependency
# (power-user-linux-setup's bootstrap.sh installs it by default), so `inv` and the standalone
# `repo-tasks` script are both assumed present on PATH here, same as this template's own
# .github/workflows/ci.yml assumes for its CI runner. `repo-tasks configs.ensure-deps` populates
# the empty dev group from repo-tasks' own canonical dependency-groups.quality (the template no
# longer hand-lists those tools — repo-tasks owns that list); `inv deps.lock` then captures a
# correct, stable initial lock before `inv configure` does venv creation/direnv/claude-hook/
# configs-pull/stamp. All three lines are bare `inv`/`repo-tasks` invocations, never `uv run` or a
# raw `uv` subcommand — `tasks.py` is already on disk by the time `_tasks` runs (copier renders it
# along with everything else first), so there's no reason to reach past the task that already wraps
# `uv lock` once the global `inv` is assumed present anyway. Nothing else about repo-tasks'
# internals is named here — see contributing/repo-family-architecture.md in power-user-linux-setup.
#
# The `when` guards make these copy-only: `copier update` re-renders the template three times (old
# version and new version into temp dirs, plus the real destination) with `_copier_operation` set
# to "update" throughout, so unguarded tasks would run in all three — hitting the network to build
# venvs in throwaway temp dirs, and skewing the computed update diff with uv.lock/config churn the
# template never rendered. After an update, re-locking/re-pulling is the generated repo's own
# `inv deps.lock`/`inv configure`, run deliberately, not a generation side effect.
_tasks:
  - command: "repo-tasks configs.ensure-deps"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "inv deps.lock"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "inv configure"
    when: "{{ _copier_operation == 'copy' }}"
