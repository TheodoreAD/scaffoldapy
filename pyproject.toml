[project]
name = "scaffoldapy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# copier is this repo's own subject matter (tests/test_template.py renders with it) — everything
# else here is repo-tasks' canonical dependency-groups.quality, put in place by
# `repo-tasks configs.ensure-deps` rather than hand-listed. repo-tasks and invoke are deliberately
# absent: they're the global `uv tool install` daily driver, same assumption this repo's own CI,
# copier.yml's _tasks, and every generated repo make.
dev = [
  "copier",
  "basedpyright>=1.39.10",
  "pytest",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
  "actionlint-py",
  "act-bin",
  "invoke-stubs @ git+https://github.com/TheodoreAD/invoke-stubs",
  "pytest-cov",
  "zizmor",
  "hadolint-py!=2.15.1.2",
  "pytest-socket",
  "pytest-timeout",
]

[tool.uv]
package = false
